name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git show --format= --check HEAD
          fi
      - name: Check unresolved merge markers
        shell: python
        run: |
          import pathlib
          import re
          import subprocess
          import sys

          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          errors = []
          for raw in paths:
              if not raw:
                  continue
              path = pathlib.Path(raw.decode("utf-8", errors="surrogateescape"))
              if path.is_symlink() or not path.is_file():
                  continue
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              for number, line in enumerate(data.splitlines(), 1):
                  if re.match(rb"^(<{7}|>{7}|\|{7})( |$)", line):
                      errors.append(f"{path}:{number}: unresolved merge marker")
          for error in errors:
              print(error)
          sys.exit(bool(errors))
      - name: Write summary
        run: |
          echo "### Repository checks passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Whitespace and unresolved merge markers checked. No application tests or builds are configured yet. No OpenAI API calls were made." >> "$GITHUB_STEP_SUMMARY"
